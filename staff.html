<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>訂單看板｜饗泰多 2027 除夕預點餐</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        paper: { DEFAULT: '#FAF7F2', 2: '#F2ECE2' },
        ink:   { DEFAULT: '#17140F', soft: '#3B362E', mute: '#7C7469' },
        gold:  { DEFAULT: '#A67C52', soft: '#C9A87C' },
        thai:  { red: '#B23A31', green: '#2C6E52' },
        brand: { DEFAULT: '#FFD400' },
      },
      fontFamily: { sans: ['"Noto Sans TC"','system-ui','sans-serif'], serif: ['"Noto Serif TC"','ui-serif','Georgia','serif'] },
    } },
  };
</script>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* 只有看板用得到的樣式 */
  .kpi { border: 1px solid var(--line); background: #fff; padding: 1.1rem 1.25rem; }
  .kpi .v { font-family: "Noto Serif TC", serif; font-size: 26px; letter-spacing: .02em; line-height: 1.15; }
  .kpi .k { font-size: 10px; letter-spacing: .28em; color: var(--gold); margin-bottom: .35rem; }
  .badge { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .5rem; font-size: 10.5px; letter-spacing: .1em; border: 1px solid transparent; }
  .badge-new { background: rgba(44,110,82,.1); color: #2C6E52; border-color: rgba(44,110,82,.22); }
  .badge-edit { background: rgba(166,124,82,.13); color: #8A6035; border-color: rgba(166,124,82,.3); }
  .badge-cancel { background: rgba(178,58,49,.1); color: #B23A31; border-color: rgba(178,58,49,.25); }
  .row { border: 1px solid var(--line); background: #fff; transition: border-color .4s var(--ease), box-shadow .4s var(--ease); }
  .row:hover { border-color: rgba(23,20,15,.3); }
  .row.open { border-color: var(--ink); }
  .row-grid { display: grid; grid-template-columns: 1fr; gap: .5rem; }
  @media (min-width: 900px) {
    .row-grid { grid-template-columns: 150px 1fr 150px 110px 110px 110px 90px; align-items: center; gap: 1rem; }
  }
  .muted { color: var(--mute); }
  .mono { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .detail { border-top: 1px solid var(--line-soft); }
  .flash { animation: flashBg 1.2s var(--ease); }
  @keyframes flashBg { 0% { background: rgba(255,212,0,.35); } 100% { background: #fff; } }
  .list-head { display: none; }
  @media (min-width: 900px) { .list-head { display: block; } }
  .list-head.is-empty { display: none !important; }
  @media print {
    header, .no-print, footer { display: none !important; }
    body { background: #fff !important; }
    .row { break-inside: avoid; border-color: #ccc; }
    .detail { display: block !important; }
  }
</style>
</head>
<body class="font-sans text-ink antialiased">

<!-- ══════════════ 密碼鎖 ══════════════ -->
<section id="staffLock" class="flex min-h-[100svh] items-center justify-center px-5">
  <div class="w-full max-w-[380px]">
    <img src="assets/img/logo.png" alt="饗泰多 SIAM MORE" class="mx-auto h-8 w-auto">
    <div class="mt-8 border border-[rgba(23,20,15,.13)] bg-white px-7 py-8">
      <p class="caps">Staff Only</p>
      <h1 class="serif mt-2 text-[20px] tracking-[.12em]">訂單看板</h1>
      <p class="mt-2 text-[11px] leading-relaxed text-ink-mute">請輸入員工密碼。此頁含客人姓名與電話，請勿外傳連結。</p>
      <form id="pwForm" class="mt-6">
        <label class="block">
          <span class="field-label">員工密碼</span>
          <input id="pwInput" type="password" class="field" autocomplete="current-password" placeholder="••••••••" required>
        </label>
        <label class="mt-4 flex items-center gap-2 text-[11px] text-ink-mute">
          <input id="pwRemember" type="checkbox" class="h-3.5 w-3.5 accent-[#17140F]">
          在這台裝置記住（下次不用再輸入）
        </label>
        <button type="submit" class="btn btn-solid mt-6 w-full text-[11.5px]">進入看板</button>
        <p id="pwMsg" class="mt-3 hidden text-[11.5px] leading-relaxed text-thai-red"></p>
      </form>
    </div>
    <p class="mt-5 text-center text-[9.5px] tracking-[.2em] text-ink-mute">
      <a href="./" class="transition hover:text-ink">← 回到點餐頁</a>
    </p>
  </div>
</section>

<!-- ══════════════ 看板 ══════════════ -->
<div id="staffApp" class="hidden">
  <header class="sticky top-0 z-30 border-b border-[rgba(23,20,15,.12)] bg-paper/95 backdrop-blur-md">
    <div class="mx-auto flex max-w-[1240px] items-center gap-3 px-5 py-3.5 sm:px-8">
      <img src="assets/img/logo.png" alt="饗泰多" class="h-6 w-auto">
      <div class="hidden sm:block">
        <p class="serif text-[13px] tracking-[.22em]">訂單看板</p>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <span id="lastUpdated" class="hidden text-[9.5px] tracking-[.16em] text-ink-mute sm:inline"></span>
        <button id="btnRefresh" class="btn btn-line px-3.5 py-2 text-[10.5px]">重新整理</button>
        <button id="btnLogout" class="btn px-3.5 py-2 text-[10.5px] text-ink-mute hover:text-ink">登出</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1240px] px-5 pb-24 pt-6 sm:px-8">

    <!-- KPI -->
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
      <div class="kpi"><p class="k">有效訂單</p><p id="statActive" class="v">—</p></div>
      <div class="kpi"><p class="k">有效金額</p><p id="statMoney" class="v">—</p></div>
      <div class="kpi"><p class="k">用餐人數</p><p id="statPeople" class="v">—</p></div>
      <div class="kpi"><p class="k">已取消</p><p id="statCancelled" class="v text-ink-mute">—</p></div>
    </div>

    <!-- 工具列 -->
    <div class="mt-6 flex flex-wrap items-center gap-3 border-b border-[rgba(23,20,15,.12)] pb-3">
      <div id="tabs" class="flex flex-wrap items-center gap-1"></div>
      <div class="ml-auto flex flex-1 items-center gap-2 sm:flex-none">
        <input id="search" type="search" placeholder="搜尋姓名／電話／訂單編號"
               class="field w-full sm:w-64" style="padding:.45rem 0;font-size:11.5px">
        <select id="sortBy" class="field w-auto shrink-0 cursor-pointer" style="padding:.45rem 1.2rem .45rem 0;font-size:11.5px">
          <option value="pickup">依取餐時間</option>
          <option value="recent">最新送出</option>
        </select>
        <label class="flex shrink-0 items-center gap-1.5 text-[10px] tracking-[.1em] text-ink-mute">
          <input id="autoRefresh" type="checkbox" checked class="h-3.5 w-3.5 accent-[#17140F]"> 自動
        </label>
      </div>
    </div>

    <div class="mt-3 flex items-center justify-between gap-3 no-print">
      <p id="listInfo" class="text-[10px] tracking-[.16em] text-ink-mute"></p>
      <div class="flex gap-2">
        <button id="btnPrint" class="btn btn-line px-3.5 py-1.5 text-[10px]">列印</button>
        <button id="btnExport" class="btn btn-solid px-3.5 py-1.5 text-[10px]">匯出 CSV</button>
      </div>
    </div>

    <div id="errBox" class="mt-4 hidden border border-thai-red/30 bg-thai-red/5 px-4 py-3 text-[11.5px] leading-relaxed text-thai-red"></div>

    <!-- 表頭（桌機） -->
    <div id="listHead" class="list-head mt-4 px-4 pb-2 text-[9.5px] tracking-[.22em] text-ink-mute">
      <div class="row-grid">
        <span>訂單編號</span><span>客人</span><span>取餐時間</span><span>人數</span><span>金額</span><span>狀態</span><span>更新</span>
      </div>
    </div>

    <div id="list" class="mt-2 space-y-2"></div>

    <div id="empty" class="hidden py-20 text-center">
      <p class="serif text-[15px] tracking-[.14em] text-ink-mute">目前沒有符合的訂單</p>
    </div>
  </main>

  <footer class="border-t border-[rgba(23,20,15,.1)] py-6 text-center text-[9px] tracking-[.18em] text-ink-mute">
    饗泰多 2027 除夕預點餐・員工專用　<a href="./" class="ml-2 underline-offset-4 hover:underline">回到點餐頁</a>
  </footer>
</div>

<script src="js/config.js"></script>
<script src="js/staff.js"></script>
</body>
</html>
